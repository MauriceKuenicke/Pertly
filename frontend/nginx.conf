# Pertly frontend server (installed as /etc/nginx/conf.d/default.conf, i.e.
# inside the `http {}` block of nginx-unprivileged's main config).
#
# - Serves the Vite build (SPA fallback to index.html).
# - Reverse-proxies /api/ to the backend container.
# - Sends security headers on every response.
#
# add_header inheritance: a location that declares ANY add_header drops all
# server-level ones. To avoid repeating the security headers, no location
# below uses add_header; per-path Cache-Control is chosen via the map instead
# (an empty value means nginx omits the header).

map $uri $pertly_cache_by_uri {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "";
    default     "no-cache";
}

# Only successful / not-modified responses get a Cache-Control from nginx; an
# error (e.g. 404 for a stale asset URL) must never be cached as immutable.
map $status $pertly_cache_control {
    ~^[23]      $pertly_cache_by_uri;
    default     "";
}

# Preserve X-Forwarded-Proto from an outer TLS-terminating proxy, if any.
map $http_x_forwarded_proto $pertly_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Docker's embedded DNS. Resolving per request (via the variable in
    # proxy_pass) means a recreated backend container with a new IP is picked
    # up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $pertly_cache_control always;

    location /api/ {
        set $pertly_backend http://backend:8000;
        proxy_pass $pertly_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pertly_forwarded_proto;

        proxy_read_timeout 60s;
        client_max_body_size 5m;
    }

    # Hashed build output: cache forever (header set via the map above). A
    # missing asset must 404, not fall back to index.html with an immutable
    # cache header.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA routes fall back to index.html (Cache-Control: no-cache via the map).
    location / {
        try_files $uri /index.html;
    }
}
